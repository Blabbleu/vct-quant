[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vct-quant"
version = "0.1.0"
description = "Match prediction quant model for the Valorant Champions Tour (VCT)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "duckdb>=1.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "kaggle>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vct = "vct_quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
