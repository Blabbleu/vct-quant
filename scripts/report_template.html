<title>VCT Quant Desk</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #eef1f6;
    --hairline: #dde3ec;
    --ink: #11151c;
    --ink-2: #4e5766;
    --ink-3: #79828f;
    --elo: #2a78d6;
    --market: #eb6834;
    --good: #0f7a4d;
    --warn: #a86000;
    --shadow: 0 1px 2px rgba(17, 21, 28, .06);
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Source Sans 3", system-ui, -apple-system, sans-serif;
    --display: "Archivo", "Source Sans 3", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #101318;
      --surface: #191d24;
      --surface-2: #21262f;
      --hairline: #2c323c;
      --ink: #f1f4f8;
      --ink-2: #b3bcc9;
      --ink-3: #8b95a3;
      --elo: #3987e5;
      --market: #f07a4a;
      --good: #35b57c;
      --warn: #d69a2a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #101318;
    --surface: #191d24;
    --surface-2: #21262f;
    --hairline: #2c323c;
    --ink: #f1f4f8;
    --ink-2: #b3bcc9;
    --ink-3: #8b95a3;
    --elo: #3987e5;
    --market: #f07a4a;
    --good: #35b57c;
    --warn: #d69a2a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }

  body { background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
  .wrap { max-width: 1060px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; display: flex; flex-direction: column; gap: 30px; }
  h1 { font-family: var(--display); font-size: clamp(26px, 4.4vw, 38px); font-weight: 700; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
  h2 { font-family: var(--display); font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  p { margin: 0; }
  a { color: var(--elo); }
  .lede { color: var(--ink-2); max-width: 62ch; }
  .eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  section { display: flex; flex-direction: column; gap: 14px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .note { color: var(--ink-3); font-size: 13px; max-width: 70ch; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px; }
  .tile .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .tile .k { font-size: 12px; color: var(--ink-3); }
  .tile.hero { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .tile.hero .k { color: var(--ink-3); }

  .panel { background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
  .legend { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--ink-2); }
  .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }

  .fx { display: grid; grid-template-columns: 78px minmax(140px, 1fr) minmax(110px, 180px) 62px 62px 42px; gap: 10px 14px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--hairline); }
  .fx:first-child { border-top: 0; }
  .fx .when { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .fx .tm { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .fx .tm b { font-weight: 600; }
  .fx .tm span { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { position: relative; height: 22px; }
  .track .rail { position: absolute; inset: 9px 0 auto; height: 4px; border-radius: 2px; background: var(--surface-2); }
  .track .mid { position: absolute; left: 50%; top: 3px; bottom: 3px; width: 1px; background: var(--hairline); }
  .track .dot { position: absolute; top: 5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; border: 2px solid var(--surface); }
  .track .dot.elo { background: var(--elo); }
  .track .dot.mkt { background: var(--market); }
  .pv { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; }
  .pv.mkt { color: var(--ink-2); }
  .fx .chips { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
  .pv .sub { display: block; font-size: 10px; color: var(--ink-3); }
  .chip { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }
  .chip.gc { background: color-mix(in srgb, var(--market) 15%, transparent); color: var(--market); }
  .chip.gap { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }

  .split { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(260px, 380px); gap: 30px; align-items: start; }
  figure { margin: 0; }
  svg { display: block; width: 100%; height: auto; }
  .rank { display: grid; grid-template-columns: 18px minmax(90px, 1fr) 1fr 74px; gap: 10px; align-items: center; padding: 6px 0; }
  .rank + .rank { border-top: 1px solid var(--hairline); }
  .rank .i { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: right; }
  .rank .bar { height: 8px; border-radius: 4px 2px 2px 4px; background: var(--elo); }
  .rank .val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; color: var(--ink-2); }
  .rank .val em { font-style: normal; color: var(--ink-3); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 10px 16px; border-bottom: 1px solid var(--hairline); }
  td { padding: 9px 16px; border-bottom: 1px solid var(--hairline); }
  tr:last-child td { border-bottom: 0; }
  td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .verdict { font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .verdict.shipped { color: var(--good); }
  .verdict.rejected { color: var(--ink-3); }
  .verdict[class$="proven"] { color: var(--warn); }
  .scroll { overflow-x: auto; }
  details { font-size: 13px; color: var(--ink-2); }
  summary { cursor: pointer; color: var(--ink-2); font-size: 12px; }
  #tip { position: fixed; z-index: 5; pointer-events: none; background: var(--ink); color: var(--ground); font-family: var(--mono); font-size: 11px; padding: 5px 8px; border-radius: 5px; transform: translate(-50%, -140%); white-space: nowrap; }
  .empty { padding: 16px; color: var(--ink-2); font-size: 13px; }
  @media (max-width: 720px) {
    .split { grid-template-columns: 1fr; }
    .fx { grid-template-columns: 1fr 1fr; grid-template-areas: "when chips" "teams teams" "track track" "pelo pmkt"; }
    .fx .when { grid-area: when; } .fx .tm { grid-area: teams; } .track { grid-area: track; }
    .pv.elo { grid-area: pelo; text-align: left; } .pv.mkt { grid-area: pmkt; }
    .fx .chips { grid-area: chips; text-align: right; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const DATA = __DATA__;
const { useState, useRef, useEffect } = React;

const pct = (x, d = 1) => (100 * x).toFixed(d) + "%";
const money = v => "$" + Math.round(v || 0).toLocaleString();
const stampUTC = iso => new Date(iso).toISOString().slice(0, 16).replace("T", " ");
const isLiquid = f => f.market != null && (f.spread == null || f.spread <= 0.10);

/* One shared tooltip: hover anything that declares tip text. */
const TipContext = React.createContext(() => {});
function useTip(text) {
  const setTip = React.useContext(TipContext);
  if (text == null) return {};
  return {
    onPointerEnter: e => {
      const r = e.currentTarget.getBoundingClientRect();
      setTip({ text, x: r.left + r.width / 2, y: r.top });
    },
    onPointerLeave: () => setTip(null),
  };
}

function Tip({ tip }) {
  if (!tip) return null;
  return <div id="tip" style={{ left: tip.x + "px", top: tip.y + "px" }}>{tip.text}</div>;
}

function Header({ coverage, generatedAt }) {
  const c = coverage;
  return (
    <header>
      <p className="eyebrow">Refreshed {stampUTC(generatedAt)} UTC</p>
      <h1>VCT Quant Desk</h1>
      <p className="lede">
        Margin-aware Elo forecasts for VCT Tier 1 and Game Changers, scored the honest way:
        walk-forward log loss, calibration, and every forecast logged before kickoff so the
        market can mark it. Lower log loss is better; a coin flip scores 0.6931.
      </p>
      <p className="note" style={{ marginTop: "10px" }}>
        {c.matches.toLocaleString()} matches loaded ({c.dated.toLocaleString()} dated), latest
        result {(c.latest_result || "").slice(0, 10)}. Model scope: {c.tier_1.toLocaleString()} Tier 1,{" "}
        {c.tier_2.toLocaleString()} Tier 2, {c.tier_3.toLocaleString()} Game Changers.
      </p>
    </header>
  );
}

function Tile({ hero, value, label }) {
  return (
    <div className={"tile" + (hero ? " hero" : "")}>
      <div className="v">{value}</div>
      <div className="k">{label}</div>
    </div>
  );
}

function Scoreboard({ backtest: b, gc, live }) {
  const liveTile = live.graded
    ? { value: live.log_loss.toFixed(4), label: `Live graded · ${live.graded} match${live.graded === 1 ? "" : "es"}` }
    : { value: "--", label: `Live graded · ${live.logged} logged, none played` };
  return (
    <section>
      <div className="tiles">
        <Tile hero value={b.log_loss.toFixed(4)}
              label={`Tier-1 log loss · ${b.n.toLocaleString()} walk-forward matches`} />
        <Tile value={b.brier.toFixed(4)} label="Brier score" />
        <Tile value={pct(b.accuracy)} label="Accuracy · favourites win ~60% anyway" />
        <Tile value={gc.log_loss.toFixed(4)} label={`Game Changers pool · K=${gc.k} untuned`} />
        <Tile {...liveTile} />
      </div>
    </section>
  );
}

function Track({ fixture: f }) {
  const eloTip = useTip(`Elo ${pct(f.p_a)} · ${Math.round(f.elo_a)} vs ${Math.round(f.elo_b)}`);
  const mktTip = useTip(f.market == null ? null :
    `Market ${pct(f.market)} · spread ${f.spread == null ? "?" : f.spread.toFixed(2)} · ${money(f.volume)} volume`);
  return (
    <div className="track">
      <div className="rail" />
      <div className="mid" />
      {f.market != null && <div className="dot mkt" style={{ left: pct(f.market, 2) }} {...mktTip} />}
      <div className="dot elo" style={{ left: pct(f.p_a, 2) }} {...eloTip} />
    </div>
  );
}

function Fixture({ fixture: f }) {
  const liquid = isLiquid(f);
  const gap = liquid && Math.abs(f.market - f.p_a) >= 0.10;
  return (
    <div className="fx">
      <div className="when">{stampUTC(f.start).slice(5)}Z</div>
      <div className="tm">
        <b>{f.team_a} <span style={{ color: "var(--ink-3)", fontWeight: 400 }}>vs</span> {f.team_b}</b>
        <span>{f.event}{f.series ? " · " + f.series : ""} · Bo{f.best_of}</span>
      </div>
      <Track fixture={f} />
      <div className="pv elo">
        {pct(f.p_a)}<span className="sub">sweep {pct(f.p_sweep, 0)}</span>
      </div>
      <div className="pv mkt">
        {f.market == null ? "—" : pct(f.market)}
        <span className="sub">{f.market == null ? "no market" : liquid ? money(f.volume) : "thin, ignore"}</span>
      </div>
      <div className="chips">
        {f.tier === 3 && <span className="chip gc">GC</span>}
        {gap && <span className="chip gap">gap</span>}
      </div>
    </div>
  );
}

function Fixtures({ fixtures }) {
  return (
    <section>
      <div className="head">
        <h2>Upcoming, model against market</h2>
        <div className="legend">
          <span><span className="swatch" style={{ background: "var(--elo)" }} />Elo</span>
          <span><span className="swatch" style={{ background: "var(--market)" }} />Polymarket</span>
        </div>
      </div>
      <div className="panel">
        {fixtures.length === 0
          ? <p className="empty">No fixtures with both teams known.</p>
          : fixtures.map(f => <Fixture key={f.match_id} fixture={f} />)}
      </div>
      <p className="note">
        Each track runs 0-100% for the first-named team. Prices are bid/ask midpoints;
        <span className="num"> - </span>means no market, and a thin market (wide spread, low
        volume) is noise rather than a disagreement worth trusting.
      </p>
    </section>
  );
}

const W = 430, H = 310, PAD = { l: 46, r: 14, t: 16, b: 44 };
const sx = v => PAD.l + v * (W - PAD.l - PAD.r);
const sy = v => H - PAD.b - v * (H - PAD.b - PAD.t);
const GRID = [0, 0.25, 0.5, 0.75, 1];

function CalibrationDot({ bucket: d, maxN }) {
  const tip = useTip(`predicted ${pct(d.predicted)} · won ${pct(d.actual)} · n=${d.n}`);
  return (
    <circle cx={sx(d.predicted)} cy={sy(d.actual)} r={4 + 8 * Math.sqrt(d.n / maxN)}
            fill="var(--elo)" stroke="var(--surface)" strokeWidth="2" {...tip} />
  );
}

function Calibration({ buckets }) {
  const maxN = Math.max(...buckets.map(d => d.n));
  const midY = (PAD.t + H - PAD.b) / 2;
  return (
    <figure>
      <div className="head"><h2>Calibration, walk-forward Tier 1</h2></div>
      <svg viewBox={`0 0 ${W} ${H}`} role="img"
           aria-label="Predicted versus actual win rate by probability bucket">
        {GRID.map(g => (
          <g key={g}>
            <line x1={sx(g)} y1={PAD.t} x2={sx(g)} y2={H - PAD.b} stroke="var(--hairline)" strokeWidth="1" />
            <line x1={PAD.l} y1={sy(g)} x2={W - PAD.r} y2={sy(g)} stroke="var(--hairline)" strokeWidth="1" />
            <text x={sx(g)} y={H - PAD.b + 16} fill="var(--ink-3)" fontSize="10"
                  textAnchor="middle" fontFamily="var(--mono)">{Math.round(g * 100)}%</text>
            <text x={PAD.l - 8} y={sy(g) + 3} fill="var(--ink-3)" fontSize="10"
                  textAnchor="end" fontFamily="var(--mono)">{Math.round(g * 100)}%</text>
          </g>
        ))}
        <line x1={sx(0)} y1={sy(0)} x2={sx(1)} y2={sy(1)} stroke="var(--ink-3)"
              strokeWidth="1.5" strokeDasharray="4 4" />
        {buckets.map(d => <CalibrationDot key={d.predicted} bucket={d} maxN={maxN} />)}
        <text x={(PAD.l + W - PAD.r) / 2} y={H - 6} fill="var(--ink-2)" fontSize="11" textAnchor="middle">
          Elo predicted win probability
        </text>
        <text x="12" y={midY} fill="var(--ink-2)" fontSize="11" textAnchor="middle"
              transform={`rotate(-90 12 ${midY})`}>Actual win rate</text>
      </svg>
      <figcaption className="note">
        Dots on the dashed line are perfectly calibrated; below it means overconfident. Dot area
        is the match count. Elo runs overconfident on favourites: its 65% picks win about 58%.
      </figcaption>
      <details>
        <summary>Calibration as a table</summary>
        <div className="scroll">
          <table>
            <thead><tr><th>Predicted</th><th>Actual</th><th style={{ textAlign: "right" }}>Matches</th></tr></thead>
            <tbody>
              {buckets.map(d => (
                <tr key={d.predicted}>
                  <td className="num">{pct(d.predicted)}</td>
                  <td className="num">{pct(d.actual)}</td>
                  <td className="n">{d.n}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </details>
    </figure>
  );
}

function RankRow({ row: r, top }) {
  const tip = useTip(`${r.team} · Elo ${Math.round(r.elo)} · ${r.matches} matches this season`);
  return (
    <div className="rank">
      <div className="i">{r.rank}</div>
      <div>{r.team}</div>
      <div>
        <div className="bar" style={{ width: Math.max(2, 100 * (r.elo - 1500) / top) + "%" }} {...tip} />
      </div>
      <div className="val">{Math.round(r.elo)} <em>{r.matches}m</em></div>
    </div>
  );
}

function Rankings({ rankings, season }) {
  const top = Math.max(...rankings.map(r => r.elo - 1500), 1);
  return (
    <figure>
      <div className="head">
        <h2>Elo leaders</h2>
        <span className="eyebrow">{season ? season + " season" : ""}</span>
      </div>
      <div>{rankings.map(r => <RankRow key={r.rank} row={r} top={top} />)}</div>
      <figcaption className="note">
        Bars measure Elo above the 1500 baseline. A rating built on few matches this season is a
        weak rating, however high it sits.
      </figcaption>
    </figure>
  );
}

function Live({ live }) {
  return (
    <section>
      <div className="head"><h2>Live forecasts, graded</h2></div>
      <div className="panel">
        {!live.graded ? (
          <p className="empty">
            {live.logged} forecast{live.logged === 1 ? "" : "s"} logged, none of those matches has
            been played yet. Scores appear here once results load.
          </p>
        ) : (
          <>
            <div className="fx" style={{ gridTemplateColumns: "1fr" }}>
              <div className="num">
                {live.graded} graded · log loss {live.log_loss.toFixed(4)} · Brier {live.brier.toFixed(4)}
                {live.market && ` · market ${live.market.market.toFixed(4)} vs Elo ${live.market.elo.toFixed(4)} on ${live.market.n} priced`}
              </div>
            </div>
            {live.rows.map(r => (
              <div className="fx" key={r.match_id}
                   style={{ gridTemplateColumns: "minmax(150px, 1fr) 90px 90px 70px" }}>
                <div>{r.team_a} vs {r.team_b}</div>
                <div className="pv elo">{pct(r.p)}</div>
                <div className="pv mkt">{r.market == null ? "-" : pct(r.market)}</div>
                <div className={"verdict " + (r.won ? "shipped" : "rejected")}>{r.won ? "won" : "lost"}</div>
              </div>
            ))}
          </>
        )}
      </div>
    </section>
  );
}

function Ledger({ ledger }) {
  return (
    <section>
      <div className="head"><h2>Experiment ledger</h2></div>
      <div className="panel scroll">
        <table>
          <thead>
            <tr><th>Variant</th><th>Holdout</th><th style={{ textAlign: "right" }}>Log loss</th><th>Verdict</th></tr>
          </thead>
          <tbody>
            {ledger.map(r => (
              <tr key={r.name}>
                <td>{r.name}</td>
                <td style={{ color: "var(--ink-3)" }}>{r.holdout}</td>
                <td className="n">{r.score}</td>
                <td className={"verdict " + r.verdict.replace(" ", "-")}>{r.verdict}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="note">
        Rejections are the point: raw Elo has beaten every variant tried so far, and each row is a
        paired test on matches the variant never trained on.
      </p>
    </section>
  );
}

function App() {
  const [tip, setTip] = useState(null);
  return (
    <TipContext.Provider value={setTip}>
      <div className="wrap">
        <Header coverage={DATA.coverage} generatedAt={DATA.generated_at} />
        <Scoreboard backtest={DATA.backtest} gc={DATA.gc} live={DATA.live} />
        <Fixtures fixtures={DATA.fixtures} />
        <section className="split">
          <Calibration buckets={DATA.backtest.calibration} />
          <Rankings rankings={DATA.rankings} season={DATA.season} />
        </section>
        <Live live={DATA.live} />
        <Ledger ledger={DATA.ledger} />
      </div>
      <Tip tip={tip} />
    </TipContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
