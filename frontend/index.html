<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VCT Quant Desk</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #eef1f6;
    --hairline: #dde3ec;
    --ink: #11151c;
    --ink-2: #4e5766;
    --ink-3: #79828f;
    --elo: #2a78d6;
    --market: #eb6834;
    --good: #0f7a4d;
    --warn: #a86000;
    --shadow: 0 1px 2px rgba(17, 21, 28, .06);
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Source Sans 3", system-ui, -apple-system, sans-serif;
    --display: "Archivo", "Source Sans 3", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #101318;
      --surface: #191d24;
      --surface-2: #21262f;
      --hairline: #2c323c;
      --ink: #f1f4f8;
      --ink-2: #b3bcc9;
      --ink-3: #8b95a3;
      --elo: #3987e5;
      --market: #f07a4a;
      --good: #35b57c;
      --warn: #d69a2a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #101318;
    --surface: #191d24;
    --surface-2: #21262f;
    --hairline: #2c323c;
    --ink: #f1f4f8;
    --ink-2: #b3bcc9;
    --ink-3: #8b95a3;
    --elo: #3987e5;
    --market: #f07a4a;
    --good: #35b57c;
    --warn: #d69a2a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }

  body { background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
  .wrap { max-width: 1060px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; display: flex; flex-direction: column; gap: 30px; }
  h1 { font-family: var(--display); font-size: clamp(26px, 4.4vw, 38px); font-weight: 700; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
  h2 { font-family: var(--display); font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  p { margin: 0; }
  a { color: var(--elo); }
  .lede { color: var(--ink-2); max-width: 62ch; }
  .eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  section { display: flex; flex-direction: column; gap: 14px; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .note { color: var(--ink-3); font-size: 13px; max-width: 70ch; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px; }
  .tile .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .tile .k { font-size: 12px; color: var(--ink-3); }
  .tile.hero { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .tile.hero .k { color: var(--ink-3); }

  .panel { background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
  .legend { display: flex; gap: 16px; align-items: center; font-size: 12px; color: var(--ink-2); }
  .swatch { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }

  .fx { display: grid; grid-template-columns: 78px minmax(140px, 1fr) minmax(110px, 180px) 62px 62px 42px; gap: 10px 14px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--hairline); }
  .fx:first-child { border-top: 0; }
  .fx .when { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .fx .tm { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .fx .tm b { font-weight: 600; }
  .fx .tm span { font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { position: relative; height: 22px; }
  .track .rail { position: absolute; inset: 9px 0 auto; height: 4px; border-radius: 2px; background: var(--surface-2); }
  .track .mid { position: absolute; left: 50%; top: 3px; bottom: 3px; width: 1px; background: var(--hairline); }
  .track .dot { position: absolute; top: 5px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; border: 2px solid var(--surface); }
  .track .dot.elo { background: var(--elo); }
  .track .dot.mkt { background: var(--market); }
  .pv { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; }
  .pv.mkt { color: var(--ink-2); }
  .fx .chips { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
  .pv .sub { display: block; font-size: 10px; color: var(--ink-3); }
  .chip { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); }
  .chip.gc { background: color-mix(in srgb, var(--market) 15%, transparent); color: var(--market); }
  .chip.gap { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }

  .split { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(260px, 380px); gap: 30px; align-items: start; }
  figure { margin: 0; }
  svg { display: block; width: 100%; height: auto; }
  .rank { display: grid; grid-template-columns: 18px minmax(90px, 1fr) 1fr 74px; gap: 10px; align-items: center; padding: 6px 0; }
  .rank + .rank { border-top: 1px solid var(--hairline); }
  .rank .i { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-align: right; }
  .rank .bar { height: 8px; border-radius: 4px 2px 2px 4px; background: var(--elo); }
  .rank .val { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; color: var(--ink-2); }
  .rank .val em { font-style: normal; color: var(--ink-3); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding: 10px 16px; border-bottom: 1px solid var(--hairline); }
  td { padding: 9px 16px; border-bottom: 1px solid var(--hairline); }
  tr:last-child td { border-bottom: 0; }
  td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .verdict { font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .verdict.shipped { color: var(--good); }
  .verdict.rejected { color: var(--ink-3); }
  .verdict[class$="proven"] { color: var(--warn); }
  .verdict.shadow { color: var(--warn); }
  .scroll { overflow-x: auto; }
  details { font-size: 13px; color: var(--ink-2); }
  summary { cursor: pointer; color: var(--ink-2); font-size: 12px; }
  #tip { position: fixed; z-index: 5; pointer-events: none; background: var(--ink); color: var(--ground); font-family: var(--mono); font-size: 11px; padding: 5px 8px; border-radius: 5px; transform: translate(-50%, -140%); white-space: nowrap; }
  .matchup { background: var(--surface); border: 1px solid var(--hairline); border-radius: 10px; box-shadow: var(--shadow); padding: 14px 16px; display: flex; flex-direction: column; gap: 11px; }
  .picks { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
  .picks select { width: 100%; font: 600 13px var(--sans); color: var(--ink); background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 6px; padding: 6px 8px; }
  .picks select:focus-visible { outline: 2px solid var(--elo); outline-offset: 1px; }
  .picks .vs { font-family: var(--mono); font-size: 11px; color: var(--ink-3); text-transform: uppercase; }
  .odds { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
  .odds .p { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 19px; font-weight: 600; }
  .odds .p.b { color: var(--ink-2); text-align: right; }
  .split-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); gap: 2px; }
  .split-bar i { display: block; }
  .split-bar i.a { background: var(--elo); }
  .split-bar i.b { background: var(--ink-3); }
  .matchup .note { font-size: 12px; }
  .refresh { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--ink-2); background: var(--surface); cursor: pointer;
    border: 1px solid var(--hairline); border-radius: 5px; padding: 3px 9px; margin-left: 8px; }
  .refresh:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-3); }
  .refresh:disabled { cursor: progress; color: var(--ink-3); }
  .refresh:focus-visible { outline: 2px solid var(--elo); outline-offset: 2px; }
  .empty { padding: 16px; color: var(--ink-2); font-size: 13px; }
  .match-link { color: inherit; text-decoration: underline; text-decoration-color: var(--hairline); text-underline-offset: 3px; }
  .match-link:hover, .match-link:focus-visible { color: var(--elo); text-decoration-color: currentColor; }
  .mc-header { display: flex; flex-direction: column; gap: 12px; }
  .mc-back { font-family: var(--mono); font-size: 12px; width: fit-content; }
  .mc-odds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .mc-odds .tile .v { font-size: clamp(20px, 5vw, 30px); }
  .mc-chart { padding: 12px; }
  .mc-chart svg { max-height: 320px; }
  .mc-chart text { font-family: var(--mono); font-size: 11px; fill: var(--ink-2); }
  .mc-points { list-style: none; margin: 0; padding: 0; }
  .mc-points li { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 9px 14px; border-top: 1px solid var(--hairline); font-size: 13px; }
  .mc-points time { min-width: 145px; color: var(--ink-2); }
  .mc-points b { font-family: var(--mono); font-weight: 500; }
  .mc-status { padding: 16px; }
  .mc-status button { margin: 10px 0 0 0; }
  @media (max-width: 390px) { .mc-odds { grid-template-columns: 1fr 1fr; } .mc-points time { min-width: 0; width: 100%; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }
  @media (max-width: 720px) {
    .split { grid-template-columns: 1fr; }
    .fx { grid-template-columns: 1fr 1fr; grid-template-areas: "when chips" "teams teams" "track track" "pelo pmkt"; }
    .fx .when { grid-area: when; } .fx .tm { grid-area: teams; } .track { grid-area: track; }
    .pv.elo { grid-area: pelo; text-align: left; } .pv.mkt { grid-area: pmkt; }
    .fx .chips { grid-area: chips; text-align: right; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div id="root"></div>

<!-- Baked mode: scripts/report.py replaces the token with the payload, so the file
     opens with no server. Served mode: the token stays, parsing fails, and the app
     fetches /api/snapshot from server.js instead. -->
<script id="baked" type="application/json">__DATA__</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;

const API = "/api/snapshot";
const bakedPayload = () => {
  try {
    return JSON.parse(document.getElementById("baked").textContent);
  } catch {
    return null;  // served mode: the token is still a token
  }
};

const pct = (x, d = 1) => (100 * x).toFixed(d) + "%";
const money = v => "$" + Math.round(v || 0).toLocaleString();
const stampUTC = iso => new Date(iso).toISOString().slice(0, 16).replace("T", " ");
const isLiquid = f => f.market != null && (f.spread == null || f.spread <= 0.10);

/* One shared tooltip: hover anything that declares tip text. */
const TipContext = React.createContext(() => {});
function useTip(text) {
  const setTip = React.useContext(TipContext);
  if (text == null) return {};
  return {
    onPointerEnter: e => {
      const r = e.currentTarget.getBoundingClientRect();
      setTip({ text, x: r.left + r.width / 2, y: r.top });
    },
    onPointerLeave: () => setTip(null),
  };
}

function Tip({ tip }) {
  if (!tip) return null;
  return <div id="tip" style={{ left: tip.x + "px", top: tip.y + "px" }}>{tip.text}</div>;
}

function Header({ coverage, generatedAt, live, onRefresh, busy }) {
  const c = coverage;
  return (
    <header>
      <p className="eyebrow">
        Refreshed {stampUTC(generatedAt)} UTC
        <span className={"chip " + (live ? "gc" : "")} style={{ marginLeft: "10px" }}>
          {live ? "live api" : "snapshot"}
        </span>
        {live && (
          <button type="button" className="refresh" onClick={onRefresh} disabled={busy}>
            {busy ? "refreshing…" : "refresh"}
          </button>
        )}
      </p>
      <h1>VCT Quant Desk</h1>
      <p className="lede">
        Margin-aware Elo forecasts for VCT Tier 1 and Game Changers, scored the honest way:
        walk-forward log loss, calibration, and every forecast logged before kickoff so the
        market can mark it. Lower log loss is better; a coin flip scores 0.6931.
      </p>
      <p className="note" style={{ marginTop: "10px" }}>
        {c.matches.toLocaleString()} matches loaded ({c.dated.toLocaleString()} dated), latest
        result {(c.latest_result || "").slice(0, 10)}. Model scope: {c.tier_1.toLocaleString()} Tier 1,{" "}
        {c.tier_2.toLocaleString()} Tier 2, {c.tier_3.toLocaleString()} Game Changers.
      </p>
    </header>
  );
}

function Tile({ hero, value, label }) {
  return (
    <div className={"tile" + (hero ? " hero" : "")}>
      <div className="v">{value}</div>
      <div className="k">{label}</div>
    </div>
  );
}

function Scoreboard({ backtest: b, gc, live }) {
  const liveTile = live.graded
    ? { value: live.log_loss.toFixed(4), label: `Live graded · ${live.graded} match${live.graded === 1 ? "" : "es"}` }
    : { value: "--", label: `Live graded · ${live.logged} logged, none played` };
  return (
    <section>
      <div className="tiles">
        <Tile hero value={b.log_loss.toFixed(4)}
              label={`Tier-1 log loss · ${b.n.toLocaleString()} walk-forward matches`} />
        <Tile value={b.brier.toFixed(4)} label="Brier score" />
        <Tile value={pct(b.accuracy)} label="Accuracy · favourites win ~60% anyway" />
        <Tile value={gc.log_loss.toFixed(4)} label={`Game Changers pool · K=${gc.k} untuned`} />
        <Tile {...liveTile} />
      </div>
    </section>
  );
}

function Track({ fixture: f }) {
  const eloTip = useTip(`Elo ${pct(f.p_a)} · ${Math.round(f.elo_a)} vs ${Math.round(f.elo_b)}`);
  const mktTip = useTip(f.market == null ? null :
    `Market ${pct(f.market)} · spread ${f.spread == null ? "?" : f.spread.toFixed(2)} · ${money(f.volume)} volume`);
  return (
    <div className="track">
      <div className="rail" />
      <div className="mid" />
      {f.market != null && <div className="dot mkt" style={{ left: pct(f.market, 2) }} {...mktTip} />}
      <div className="dot elo" style={{ left: pct(f.p_a, 2) }} {...eloTip} />
    </div>
  );
}

function Fixture({ fixture: f, served }) {
  const liquid = isLiquid(f);
  const gap = liquid && Math.abs(f.market - f.p_a) >= 0.10;
  const teams = <>{f.team_a} <span style={{ color: "var(--ink-3)", fontWeight: 400 }}>vs</span> {f.team_b}</>;
  return (
    <div className="fx">
      <div className="when">{stampUTC(f.start).slice(5)}Z</div>
      <div className="tm">
        <b>{served ? <a className="match-link" href={`/match/${f.match_id}`} aria-label={`Match Center: ${f.team_a} vs ${f.team_b}`}>{teams}</a> : teams}</b>
        <span>{f.event}{f.series ? " · " + f.series : ""} · Bo{f.best_of}</span>
      </div>
      <Track fixture={f} />
      <div className="pv elo">
        {pct(f.p_a)}<span className="sub">sweep {pct(f.p_sweep, 0)}</span>
      </div>
      <div className="pv mkt">
        {f.market == null ? "—" : pct(f.market)}
        <span className="sub">{f.market == null ? "no market" : liquid ? money(f.volume) : "thin, ignore"}</span>
      </div>
      <div className="chips">
        {f.tier === 3 && <span className="chip gc">GC</span>}
        {gap && <span className="chip gap">gap</span>}
      </div>
    </div>
  );
}

function Fixtures({ fixtures, served }) {
  return (
    <section>
      <div className="head">
        <h2>Upcoming, model against market</h2>
        <div className="legend">
          <span><span className="swatch" style={{ background: "var(--elo)" }} />Elo</span>
          <span><span className="swatch" style={{ background: "var(--market)" }} />Polymarket</span>
        </div>
      </div>
      <div className="panel">
        {fixtures.length === 0
          ? <p className="empty">No fixtures with both teams known.</p>
          : fixtures.map(f => <Fixture key={f.match_id} fixture={f} served={served} />)}
      </div>
      <p className="note">
        Each track runs 0-100% for the first-named team. Prices are bid/ask midpoints;
        <span className="num"> - </span>means no market, and a thin market (wide spread, low
        volume) is noise rather than a disagreement worth trusting.
      </p>
    </section>
  );
}

const W = 430, H = 310, PAD = { l: 46, r: 14, t: 16, b: 44 };
const sx = v => PAD.l + v * (W - PAD.l - PAD.r);
const sy = v => H - PAD.b - v * (H - PAD.b - PAD.t);
const GRID = [0, 0.25, 0.5, 0.75, 1];

function CalibrationDot({ bucket: d, maxN }) {
  const tip = useTip(`predicted ${pct(d.predicted)} · won ${pct(d.actual)} · n=${d.n}`);
  return (
    <circle cx={sx(d.predicted)} cy={sy(d.actual)} r={4 + 8 * Math.sqrt(d.n / maxN)}
            fill="var(--elo)" stroke="var(--surface)" strokeWidth="2" {...tip} />
  );
}

function Calibration({ buckets }) {
  const maxN = Math.max(...buckets.map(d => d.n));
  const midY = (PAD.t + H - PAD.b) / 2;
  return (
    <figure>
      <div className="head"><h2>Calibration, walk-forward Tier 1</h2></div>
      <svg viewBox={`0 0 ${W} ${H}`} role="img"
           aria-label="Predicted versus actual win rate by probability bucket">
        {GRID.map(g => (
          <g key={g}>
            <line x1={sx(g)} y1={PAD.t} x2={sx(g)} y2={H - PAD.b} stroke="var(--hairline)" strokeWidth="1" />
            <line x1={PAD.l} y1={sy(g)} x2={W - PAD.r} y2={sy(g)} stroke="var(--hairline)" strokeWidth="1" />
            <text x={sx(g)} y={H - PAD.b + 16} fill="var(--ink-3)" fontSize="10"
                  textAnchor="middle" fontFamily="var(--mono)">{Math.round(g * 100)}%</text>
            <text x={PAD.l - 8} y={sy(g) + 3} fill="var(--ink-3)" fontSize="10"
                  textAnchor="end" fontFamily="var(--mono)">{Math.round(g * 100)}%</text>
          </g>
        ))}
        <line x1={sx(0)} y1={sy(0)} x2={sx(1)} y2={sy(1)} stroke="var(--ink-3)"
              strokeWidth="1.5" strokeDasharray="4 4" />
        {buckets.map(d => <CalibrationDot key={d.predicted} bucket={d} maxN={maxN} />)}
        <text x={(PAD.l + W - PAD.r) / 2} y={H - 6} fill="var(--ink-2)" fontSize="11" textAnchor="middle">
          Elo predicted win probability
        </text>
        <text x="12" y={midY} fill="var(--ink-2)" fontSize="11" textAnchor="middle"
              transform={`rotate(-90 12 ${midY})`}>Actual win rate</text>
      </svg>
      <figcaption className="note">
        Dots on the dashed line are perfectly calibrated; below it means overconfident. Dot area
        is the match count. Elo runs overconfident on favourites: its 65% picks win about 58%.
      </figcaption>
      <details>
        <summary>Calibration as a table</summary>
        <div className="scroll">
          <table>
            <thead><tr><th>Predicted</th><th>Actual</th><th style={{ textAlign: "right" }}>Matches</th></tr></thead>
            <tbody>
              {buckets.map(d => (
                <tr key={d.predicted}>
                  <td className="num">{pct(d.predicted)}</td>
                  <td className="num">{pct(d.actual)}</td>
                  <td className="n">{d.n}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </details>
    </figure>
  );
}

function RankRow({ row: r, top }) {
  const tip = useTip(`${r.team} · Elo ${Math.round(r.elo)} · ${r.matches} matches this season`);
  return (
    <div className="rank">
      <div className="i">{r.rank}</div>
      <div>{r.team}</div>
      <div>
        <div className="bar" style={{ width: Math.max(2, 100 * (r.elo - 1500) / top) + "%" }} {...tip} />
      </div>
      <div className="val">{Math.round(r.elo)} <em>{r.matches}m</em></div>
    </div>
  );
}

/* The model's own formula: a 400-point edge is 10:1 odds. */
const eloWinProbability = (eloA, eloB) => 1 / (1 + Math.pow(10, (eloB - eloA) / 400));

function Matchup({ teams }) {
  const [a, setA] = useState(0);
  const [b, setB] = useState(1);
  if (teams.length < 2) return null;
  const A = teams[Math.min(a, teams.length - 1)];
  const B = teams[Math.min(b, teams.length - 1)];
  const pA = eloWinProbability(A.elo, B.elo);
  const gap = Math.round(A.elo - B.elo);
  const thin = Math.min(A.matches, B.matches);
  const options = teams.map((t, i) => (
    <option key={t.rank} value={i}>{t.team} · {Math.round(t.elo)}</option>
  ));
  return (
    <div className="matchup">
      <div className="picks">
        <select aria-label="First team" value={a} onChange={e => setA(+e.target.value)}>{options}</select>
        <span className="vs">vs</span>
        <select aria-label="Second team" value={b} onChange={e => setB(+e.target.value)}>{options}</select>
      </div>
      <div className="odds">
        <span className="p" style={{ color: "var(--elo)" }}>{pct(pA)}</span>
        <span className="split-bar">
          <i className="a" style={{ width: pct(pA, 2) }} />
          <i className="b" style={{ width: pct(1 - pA, 2) }} />
        </span>
        <span className="p b">{pct(1 - pA)}</span>
      </div>
      <p className="note">
        {A.team === B.team
          ? "Same team both sides, so it is a coin flip by definition."
          : `${gap === 0 ? "Level on rating" : `${gap > 0 ? A.team : B.team} by ${Math.abs(gap)} Elo`}` +
            ` · series odds, not a map. ${thin < 15
              ? `Thin evidence: ${thin} matches on the lighter side this season.`
              : "Both sides have a season of matches behind the rating."}`}
      </p>
    </div>
  );
}

function Rankings({ rankings, season }) {
  const top = Math.max(...rankings.map(r => r.elo - 1500), 1);
  return (
    <figure>
      <div className="head">
        <h2>Elo leaders</h2>
        <span className="eyebrow">{season ? season + " season" : ""}</span>
      </div>
      <Matchup teams={rankings} />
      <div style={{ marginTop: "14px" }}>{rankings.map(r => <RankRow key={r.rank} row={r} top={top} />)}</div>
      <figcaption className="note">
        Bars measure Elo above the 1500 baseline. A rating built on few matches this season is a
        weak rating, however high it sits. Head-to-head above is the same margin-aware Elo the
        fixtures use, with no map veto or roster news in it.
      </figcaption>
    </figure>
  );
}

function Live({ live }) {
  return (
    <section>
      <div className="head"><h2>Live forecasts, graded</h2></div>
      <div className="panel">
        {!live.graded ? (
          <p className="empty">
            {live.logged} forecast{live.logged === 1 ? "" : "s"} logged, none of those matches has
            been played yet. Scores appear here once results load.
          </p>
        ) : (
          <>
            <div className="fx" style={{ gridTemplateColumns: "1fr" }}>
              <div className="num">
                {live.graded} graded · log loss {live.log_loss.toFixed(4)} · Brier {live.brier.toFixed(4)}
                {live.market && ` · market ${live.market.market.toFixed(4)} vs Elo ${live.market.elo.toFixed(4)} on ${live.market.n} priced`}
              </div>
              {live.shadows && Object.entries(live.shadows).map(([name, s]) => (
                <div className="num" key={name}>
                  shadow {name}: {s.shadow.toFixed(4)} vs Elo {s.elo.toFixed(4)} on {s.n}
                </div>
              ))}
            </div>
            {live.rows.map(r => (
              <div className="fx" key={r.match_id}
                   style={{ gridTemplateColumns: "minmax(150px, 1fr) 90px 90px 70px" }}>
                <div>{r.team_a} vs {r.team_b}</div>
                <div className="pv elo">{pct(r.p)}</div>
                <div className="pv mkt">{r.market == null ? "-" : pct(r.market)}</div>
                <div className={"verdict " + (r.won ? "shipped" : "rejected")}>{r.won ? "won" : "lost"}</div>
              </div>
            ))}
          </>
        )}
      </div>
    </section>
  );
}

function Ledger({ ledger }) {
  return (
    <section>
      <div className="head"><h2>Experiment ledger</h2></div>
      <div className="panel scroll">
        <table>
          <thead>
            <tr><th>Variant</th><th>Holdout</th><th style={{ textAlign: "right" }}>Log loss</th><th>Verdict</th></tr>
          </thead>
          <tbody>
            {ledger.map(r => (
              <tr key={r.name}>
                <td>{r.name}</td>
                <td style={{ color: "var(--ink-3)" }}>{r.holdout}</td>
                <td className="n">{r.score}</td>
                <td className={"verdict " + r.verdict.replace(" ", "-")}>{r.verdict}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="note">
        Rejections are the point: raw Elo has beaten every variant tried so far, and each row is a
        paired test on matches the variant never trained on.
      </p>
    </section>
  );
}

function Loading({ error, onRetry }) {
  return (
    <div className="wrap">
      <header>
        <p className="eyebrow">{error ? "Backend unreachable" : "Loading from the API"}</p>
        <h1>VCT Quant Desk</h1>
        <p className="lede">
          {error
            ? "The backend did not answer. Start it with `node server.js`, and make sure " +
              "`vct init-db` and `vct update` have run at least once."
            : "Fetching the current snapshot from server.js."}
        </p>
        {error && (
          <>
            <p className="note" style={{ marginTop: "10px" }}>{error}</p>
            <p style={{ marginTop: "12px" }}>
              <button type="button" className="refresh" onClick={onRetry}>try again</button>
            </p>
          </>
        )}
      </header>
    </div>
  );
}

function MovementChart({ points, team }) {
  const width = 600, height = 260, left = 48, right = 16, top = 16, bottom = 34;
  const times = points.map(p => Date.parse(p.observed_at));
  const start = Math.min(...times), end = Math.max(...times);
  const x = i => left + (end === start ? (width - left - right) / 2 :
    (times[i] - start) / (end - start) * (width - left - right));
  const y = p => top + (1 - p) * (height - top - bottom);
  const path = (indexes, field) => indexes.map((i, n) =>
    `${n ? "L" : "M"}${x(i).toFixed(1)},${y(points[i][field]).toFixed(1)}`).join(" ");
  const markets = [];
  let run = [];
  points.forEach((p, i) => {
    if (p.market != null) run.push(i);
    else if (run.length) { markets.push(run); run = []; }
  });
  if (run.length) markets.push(run);
  return (
    <figure className="panel mc-chart">
      <svg viewBox={`0 0 ${width} ${height}`} role="img"
           aria-label={`Sampled pre-start win probability for ${team}; exact values listed below`}>
        {[0, .25, .5, .75, 1].map(v => <g key={v}>
          <line x1={left} x2={width - right} y1={y(v)} y2={y(v)} stroke="var(--hairline)" />
          <text x={left - 7} y={y(v) + 4} textAnchor="end">{Math.round(v * 100)}%</text>
        </g>)}
        {markets.map((segment, i) => <path key={i} d={path(segment, "market")}
          fill="none" stroke="var(--market)" strokeWidth="2.5" />)}
        {points.map((p, i) => p.market == null ? null :
          <circle key={`m${i}`} cx={x(i)} cy={y(p.market)} r="3" fill="var(--market)">
            <title>{stampUTC(p.observed_at)} UTC · market {pct(p.market)}</title>
          </circle>)}
        <path d={path(points.map((_, i) => i), "elo")}
              fill="none" stroke="var(--elo)" strokeWidth="2.5" />
        {points.map((p, i) => <circle key={i} cx={x(i)} cy={y(p.elo)} r="3" fill="var(--elo)">
          <title>{stampUTC(p.observed_at)} UTC · Elo {pct(p.elo)}</title>
        </circle>)}
        <text x={left} y={height - 7}>{stampUTC(points[0].observed_at).slice(5)} UTC</text>
        <text x={width - right} y={height - 7} textAnchor="end">
          {points.length > 1 ? stampUTC(points[points.length - 1].observed_at).slice(5) + " UTC" : ""}
        </text>
      </svg>
      <figcaption className="note">0–100% chance of {team} winning the series; dots are sampled refreshes,
        not a continuous price feed. Orange gaps mean no comparable market quote.</figcaption>
    </figure>
  );
}

function MatchCenter({ id }) {
  const [match, setMatch] = useState(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(true);
  const load = useCallback(async () => {
    setBusy(true); setError(null);
    try {
      const resp = await fetch(`/api/match/${id}`, { cache: "no-store" });
      if (resp.status === 404) throw new Error("No pre-start forecast history for this match.");
      if (!resp.ok) throw new Error("The Match Center is temporarily unavailable.");
      setMatch(await resp.json());
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }, [id]);
  useEffect(() => { load(); }, [load]);
  const last = match?.points[match.points.length - 1];
  return <main className="wrap">
    <header className="mc-header">
      <a className="mc-back" href="/">← All forecasts</a>
      <p className="eyebrow">Match Center · #{id}</p>
      <h1>{match ? `${match.team_a} vs ${match.team_b}` : "Match Center"}</h1>
      {match && <p className="lede">Scheduled {stampUTC(match.scheduled_at)} UTC · series win chance for {match.team_a}.</p>}
    </header>
    {busy && !match && <p className="panel mc-status" role="status">Loading pre-start forecasts…</p>}
    {error && <div className="panel mc-status" role="alert"><p>{error}</p>
      <button type="button" className="refresh" onClick={load}>Try again</button></div>}
    {match && <>
      <section>
        <div className="head"><h2>Latest recorded forecast</h2><span className="eyebrow">{stampUTC(last.observed_at)} UTC</span></div>
        <div className="mc-odds">
          <Tile value={pct(last.elo)} label={`Elo · ${match.team_a} win`} />
          <Tile value={last.market == null ? "—" : pct(last.market)} label="Polymarket midpoint · same contract" />
        </div>
        <p className="note">These are separate estimates, not betting advice. A missing market quote is not zero.
          {last.spread != null && ` Latest bid/ask spread: ${pct(last.spread)}.`}</p>
      </section>
      <section>
        <div className="head"><h2>Probability movement</h2><span className="legend">
          <span><span className="swatch" style={{ background: "var(--elo)" }} />Elo</span>
          <span><span className="swatch" style={{ background: "var(--market)" }} />Market</span>
        </span></div>
        <MovementChart points={match.points} team={match.team_a} />
        <p className="note">{match.note} Each forecast was recorded before its then-scheduled kickoff.
          Same-pairing reschedules may share a history; changed pairings are excluded. No closing-price claim.</p>
        <details><summary>Every recorded sample ({match.points.length})</summary>
          <ol className="panel mc-points">{match.points.map((p, i) => <li key={i}>
            <time dateTime={p.observed_at}>{stampUTC(p.observed_at)} UTC</time>
            <span>Elo <b>{pct(p.elo)}</b></span>
            <span>Market <b>{p.market == null ? "—" : pct(p.market)}</b></span>
            {p.spread != null && <span>spread <b>{pct(p.spread)}</b></span>}
          </li>)}</ol>
        </details>
      </section>
    </>}
  </main>;
}

function App() {
  const [tip, setTip] = useState(null);
  const [data, setData] = useState(bakedPayload);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const served = !bakedPayload();

  const load = useCallback(async () => {
    setBusy(true);
    setError(null);
    try {
      const resp = await fetch(API, { cache: "no-store" });
      if (!resp.ok) throw new Error(`${API} answered ${resp.status}`);
      setData(await resp.json());
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  }, []);

  useEffect(() => { if (served) load(); }, [served, load]);

  if (!data) return <Loading error={error} onRetry={load} />;
  return (
    <TipContext.Provider value={setTip}>
      <div className="wrap">
        <Header coverage={data.coverage} generatedAt={data.generated_at}
                live={served} onRefresh={load} busy={busy} />
        <Scoreboard backtest={data.backtest} gc={data.gc} live={data.live} />
        <Fixtures fixtures={data.fixtures} served={served} />
        <section className="split">
          <Calibration buckets={data.backtest.calibration} />
          <Rankings rankings={data.rankings} season={data.season} />
        </section>
        <Live live={data.live} />
        <Ledger ledger={data.ledger} />
      </div>
      <Tip tip={tip} />
    </TipContext.Provider>
  );
}

const matchPath = /^\/match\/([1-9][0-9]*)$/.exec(window.location.pathname);
ReactDOM.createRoot(document.getElementById("root")).render(
  matchPath ? <MatchCenter id={matchPath[1]} /> : <App />
);
</script>
</body>
</html>
